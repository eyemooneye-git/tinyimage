[package]
name = "tinyimage"
version = "1.0.0"
edition = "2021"
description = "把 PNG / JPG 图片压缩到约 50 KB 的 Windows 小工具"

[[bin]]
name = "tinyimage"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.7.1"
color_quant = "2.0.0"
png = "0.18.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
